<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>综合工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,'SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:root{--bg:#f5f5f7;--card:#ffffff;--inset:#eeeef0;--text:#1d1d1f;--text-2:#6e6e73;--text-3:#aeaeb2;--blue:#007AFF;--green:#34C759;--orange:#FF9500;--red:#FF3B30;--purple:#AF52DE;--yellow:#FFCC00;--radius:14px;--radius-sm:10px;--gap:16px;--bdr:rgba(0,0,0,0.08);--bdr2:rgba(0,0,0,0.14);--r:var(--radius);--rs:var(--radius-sm)}
.container{max-width:480px;margin:0 auto;padding:0 16px 80px}
.header{position:sticky;top:0;z-index:100;background:rgba(245,245,247,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--orange),var(--red));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff}
.header-title{font-size:15px;font-weight:600;color:var(--text)}
.header-sub{font-size:11px;color:var(--text-2);margin-top:1px}
.header-date{font-size:11px;color:var(--text-3);text-align:right}
.main-tabs{position:sticky;top:56px;z-index:99;background:rgba(245,245,247,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;gap:6px;padding:10px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--bdr)}
.main-tabs::-webkit-scrollbar{display:none}
.main-tab{flex-shrink:0;padding:7px 14px;border-radius:20px;font-size:12px;font-weight:500;color:var(--text-2);background:transparent;border:1px solid transparent;transition:all 0.2s;white-space:nowrap;cursor:pointer}
.main-tab.active{color:var(--text);background:var(--card);border-color:var(--bdr2)}
.main-panel{display:none}
.main-panel.active{display:block}
.sub-tabs{display:flex;gap:6px;padding:12px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:11px;font-weight:500;color:var(--text-2);background:transparent;border:1px solid transparent;transition:all 0.2s;white-space:nowrap;cursor:pointer}
.sub-tab.active{color:var(--text);background:var(--card);border-color:var(--bdr2)}
.sub-panel{display:none}
.sub-panel.active{display:block;animation:fadeUp 0.3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:16px;border:1px solid var(--bdr)}
.card-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.big-num{font-size:28px;font-weight:800;color:var(--text);line-height:1.1}
.big-num .unit{font-size:14px;font-weight:400;color:var(--text-2)}
.big-sub{font-size:12px;color:var(--text-2);margin-top:4px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kpi-item{background:var(--inset);border-radius:var(--radius-sm);padding:14px;text-align:center}
.kpi-value{font-size:24px;font-weight:700}
.kpi-value.income{color:var(--green)}
.kpi-value.expense{color:var(--red)}
.kpi-value.balance{color:var(--blue)}
.kpi-label{font-size:11px;color:var(--text-2);margin-top:4px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-item{background:var(--inset);border-radius:var(--radius-sm);padding:14px;position:relative;overflow:hidden}
.cat-item::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px}
.cat-icon{font-size:16px;margin-bottom:4px}
.cat-name{font-size:12px;color:var(--text-2);margin-bottom:2px}
.cat-amount{font-size:18px;font-weight:700;color:var(--text)}
.cat-pct{font-size:11px;color:var(--text-3);margin-top:2px}
.tx-list{display:flex;flex-direction:column;gap:0}
.tx-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--bdr)}
.tx-item:last-child{border-bottom:none}
.tx-left{flex:1;min-width:0}
.tx-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--text-3);margin-top:2px}
.tx-amount{font-size:15px;font-weight:600;white-space:nowrap;margin-left:12px}
.tx-amount.income{color:var(--green)}
.tx-amount.expense{color:var(--text-2)}
.tx-emoji{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--inset);margin-right:10px;flex-shrink:0}
.section-title{font-size:13px;font-weight:600;color:var(--blue);margin:16px 0 10px;padding-left:2px}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px}
.empty-state .icon{font-size:40px;margin-bottom:12px;opacity:0.5}
/* 吉格标签 */
.jige-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.jige-chip{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;white-space:nowrap;line-height:1.5}
.jige-chip.sanqi{background:rgba(255,204,0,0.25);color:#B8860B;border:1px solid rgba(255,204,0,0.4)}
.jige-chip.dun{background:rgba(0,122,255,0.12);color:var(--blue);border:1px solid rgba(0,122,255,0.3)}
.jige-chip.yunu{background:rgba(175,82,222,0.12);color:var(--purple);border:1px solid rgba(175,82,222,0.3)}
.jige-chip.normal{background:rgba(52,199,89,0.12);color:var(--green);border:1px solid rgba(52,199,89,0.25)}
.jige-count{font-size:10px;font-weight:700;padding:1px 6px;border-radius:8px;background:rgba(255,204,0,0.25);color:#B8860B;margin-left:4px}
.date-filter{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.date-filter input{background:var(--inset);color:var(--text);border:1px solid var(--bdr);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;flex:1}
.date-filter span{color:var(--text-3);font-size:12px;flex-shrink:0}
.date-filter select{background:var(--inset);color:var(--text);border:1px solid var(--bdr);border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
.day-summary{background:var(--inset);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
.day-summary .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.day-summary .row:last-child{margin-bottom:0}
.day-summary .label{font-size:12px;color:var(--text-2)}
.day-summary .val{font-size:16px;font-weight:700}
.day-summary .val.inc{color:var(--green)}
.day-summary .val.exp{color:var(--red)}
.month-compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.month-card{background:var(--inset);border-radius:var(--radius-sm);padding:16px;text-align:center}
.month-card .month-name{font-size:12px;color:var(--text-2);margin-bottom:8px}
.month-card .month-exp{font-size:20px;font-weight:700;color:var(--red);margin-bottom:4px}
.month-card .month-inc{font-size:14px;font-weight:600;color:var(--green)}
.month-card .month-bal{font-size:12px;color:var(--text-3);margin-top:4px}
.income-section{background:var(--inset);border-radius:var(--radius-sm);padding:14px;margin-top:12px}
.income-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bdr)}
.income-row:last-child{border-bottom:none}
.income-row .name{font-size:13px;color:var(--text-2)}
.income-row .amt{font-size:14px;font-weight:600;color:var(--green)}
.income-total{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:6px;border-top:1px solid var(--bdr2)}
.income-total .name{font-size:14px;font-weight:600;color:var(--text)}
.income-total .amt{font-size:18px;font-weight:700;color:var(--green)}
.progress-bar{height:6px;background:var(--inset);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:3px;transition:width 0.6s ease}
.pz-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-3);text-align:center}
.pz-placeholder .icon{font-size:60px;margin-bottom:16px;opacity:0.3}
.pz-placeholder .title{font-size:16px;color:var(--text-2);margin-bottom:8px}
.pz-placeholder .desc{font-size:12px}
input[type="date"],input[type="number"],input[type="text"],select{background:var(--inset)!important;color:var(--text)!important;border:1px solid var(--bdr2)!important}
input::placeholder{color:var(--text-3)}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="avatar">综</div>
      <div>
        <div class="header-title">综合工作台</div>
        <div class="header-sub">排盘 · 记账 · 愿望清单</div>
      </div>
    </div>
    <div class="header-date" id="headerDate"></div>
  </div>

  <div class="main-tabs">
    <div class="main-tab" data-main="paipan" onclick="switchMain('paipan')">奇门排盘</div>
    <div class="main-tab active" data-main="jizhang" onclick="switchMain('jizhang')">记账</div>
    <div class="main-tab" data-main="wishlist" onclick="switchMain('wishlist')">愿望清单</div>
  </div>

  <!-- 排盘 Panel -->
  <div class="main-panel" id="panel-paipan">
    <div class="sub-tabs">
      <div class="sub-tab active" data-sub="pz-recommend" onclick="switchSub('pz-recommend')">推荐</div>
      <div class="sub-tab" data-sub="pz-detail" onclick="switchSub('pz-detail')">吉时表</div>
      <div class="sub-tab" data-sub="pz-info" onclick="switchSub('pz-info')">排盘信息</div>
    </div>
    <div class="sub-panel active" id="sub-pz-recommend"></div>
    <div class="sub-panel" id="sub-pz-detail"></div>
    <div class="sub-panel" id="sub-pz-info"></div>
  </div>

  <!-- 记账 Panel -->
  <div class="main-panel active" id="panel-jizhang">
    <!-- 记账切换按钮 -->
    <button onclick="toggleAddForm()" style="margin-top:12px;width:100%;padding:12px;background:var(--card);color:var(--text);border:1px solid var(--bdr2);border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px">✏️ 记账</button>
    <!-- 快速录入卡片（默认收起） -->
    <div class="card" id="add-card" style="display:none;margin-top:12px;padding:18px">
      <div class="card-title" style="margin-bottom:14px">✏️ 快速记账</div>
      <div id="add-form" style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;gap:8px">
          <button type="button" id="type-expense-btn" onclick="switchTxType('expense')" style="flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--bdr2);background:var(--red);color:#fff">💸 支出</button>
          <button type="button" id="type-income-btn" onclick="switchTxType('income')" style="flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--bdr2);background:var(--inset);color:var(--text-2)">💰 收入</button>
        </div>
        <div style="display:flex;gap:10px">
          <div style="flex:1">
            <label style="display:block;font-size:13px;color:var(--text-2);margin-bottom:4px">日期</label>
            <input type="date" id="add-date" style="width:100%;padding:10px;border-radius:8px;font-size:14px">
          </div>
          <div style="flex:1">
            <label style="display:block;font-size:13px;color:var(--text-2);margin-bottom:4px">金额 (元)</label>
            <input type="number" id="add-amount" step="0.01" placeholder="0.00" style="width:100%;padding:10px;border-radius:8px;font-size:14px">
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <div style="flex:1">
            <label style="display:block;font-size:13px;color:var(--text-2);margin-bottom:4px">项目名称</label>
            <input type="text" id="add-item" placeholder="项目名称" style="width:100%;padding:10px;border-radius:8px;font-size:14px">
          </div>
          <div style="flex:1">
            <label style="display:block;font-size:13px;color:var(--text-2);margin-bottom:4px">分类</label>
            <select id="add-category" style="width:100%;padding:10px;border-radius:8px;font-size:14px"></select>
          </div>
        </div>
        <button onclick="previewTransaction()" style="margin-top:4px;padding:12px;background:var(--blue);color:white;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer">保存</button>
      </div>
      <div id="add-confirm" style="display:none;margin-top:16px">
        <div style="background:var(--inset);border-radius:12px;padding:16px;margin-bottom:16px">
          <div style="font-size:13px;color:var(--text-2);margin-bottom:8px">请确认以下记账信息：</div>
          <div id="confirm-detail" style="font-size:15px;font-weight:500;line-height:1.8"></div>
        </div>
        <div style="display:flex;gap:12px">
          <button onclick="confirmTransaction()" style="flex:1;padding:12px;background:var(--green);color:#0f1115;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer">✓ 确认录入</button>
          <button onclick="cancelPreview()" style="flex:1;padding:12px;background:var(--bdr2);color:var(--text);border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer">取消</button>
        </div>
      </div>
    </div>

    <div class="sub-tabs">
      <div class="sub-tab active" data-sub="overview" onclick="switchSub('overview')">总览</div>
      <div class="sub-tab" data-sub="month" onclick="switchSub('month')">月度</div>
      <div class="sub-tab" data-sub="detail" onclick="switchSub('detail')">明细</div>
    </div>

    <!-- 总览 -->
    <div class="sub-panel active" id="sub-overview"></div>

    <!-- 月度 -->
    <div class="sub-panel" id="sub-month"></div>

    <!-- 明细 -->
    <div class="sub-panel" id="sub-detail"></div>
  </div>

  <!-- 愿望清单 Panel -->
  <div class="main-panel" id="panel-wishlist">
    <!-- 装备/补剂迁移提示 -->
    <div class="card" style="margin-top:12px;border-left:4px solid var(--orange)">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <span style="font-size:24px;flex-shrink:0">📋</span>
        <div>
          <div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px">完整装备与补剂清单已移至健康管理工作台</div>
          <div style="font-size:12px;color:var(--text-3)">→ 请前往「健康管理工作台 → 备忘 Tab」查看完整清单</div>
        </div>
      </div>
    </div>
    <!-- 眼镜选配（愿望清单） -->
    <div id="daigou-glasses"></div>
  </div>
</div>

<script>

// ========== HELPERS ==========
function fmt(n) { return n.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtWan(n) { if(Math.abs(n)>=10000) return (n/10000).toFixed(2)+'万'; return fmt(n); }

// 判断交易类型：没有type字段的旧数据默认为支出
function isIncome(t) { return t.type === 'income'; }

function formatDate(d) {
  const parts = d.split('-');
  return parseInt(parts[1]) + '/' + parseInt(parts[2]);
}

function getMonthRange() {
  const now = new Date();
  const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0');
  const start = `${y}-${m}-01`;
  const lastDay = new Date(y, parseInt(m), 0).getDate();
  const end = `${y}-${m}-${String(lastDay).padStart(2,'0')}`;
  return [start, end];
}

function filterByDate(items, start, end) {
  return items.filter(t => t.date >= start && t.date <= end);
}

// 统一获取所有交易（transactions + incomeRecords 初始数据）
function getAllTx() {
  const incMapped = incomeRecords.map(r => ({date:r.date, category:r.item.includes('工资')?'工资':(r.item.includes('退货')||r.item.includes('退'))?'退款':(r.item.includes('初始')?'初始余额':'其他收入'), item:r.item, amount:r.amount, type:'income', isInitial:true}));
  return [...transactions, ...incMapped];
}

function calcExpense(list) { return list.filter(t=>!isIncome(t)).reduce((s,t) => s + (t.amount||0), 0); }
function calcIncome(list) { return list.filter(t=>isIncome(t)).reduce((s,t) => s + (t.amount||0), 0); }

function groupByCategory(list) {
  const g = {};
  list.forEach(t => { const c = t.category || '未分类'; g[c] = (g[c]||0) + t.amount; });
  return g;
}

function daysSinceStart() {
  const s = new Date(startDate);
  const n = new Date();
  return Math.max(1, Math.floor((n - s) / 86400000) + 1);
}

function renderMonth() {
  const panel = document.getElementById('sub-month');

  var monthSet = {};
  allTx.forEach(function(t) {
    var ym = t.date.slice(0, 7);
    if (!monthSet[ym]) monthSet[ym] = ym;
  });
  var months = Object.keys(monthSet).sort().reverse();

  // Take last 2 months (most recent first)
  var recentMonths = months.slice(0, 2);

  // Build month comparison cards
  var compareHtml = '<div class="month-compare">';
  recentMonths.forEach(function(ym) {
    var parts = ym.split('-');
    var monthLabel = parseInt(parts[1]) + '月';
    var mTxs = allTx.filter(function(t) { return t.date.slice(0,7) === ym; });
    var mExp = calcExpense(mTxs);
    var mInc = calcIncome(mTxs);
    compareHtml += '<div class="month-card">' +
      '<div class="month-name">' + monthLabel + '</div>' +
      '<div class="month-exp">¥' + fmt(mExp) + '</div>' +
      '<div class="month-inc">收入 ¥' + fmt(mInc) + '</div>' +
      '<div class="month-bal">结余 ¥' + fmt(mInc - mExp) + '</div>' +
    '</div>';
  });
  compareHtml += '</div>';

  // Build current month detail (most recent month)
  var curMonth = months[0];
  var curStart = curMonth + '-01';
  var curParts = curMonth.split('-');
  var curYear = parseInt(curParts[0]);
  var curMo = parseInt(curParts[1]);
  var lastDay = new Date(curYear, curMo, 0).getDate();
  var curEnd = curMonth + '-' + String(lastDay).padStart(2,'0');
  var label = curMonth === getMonthRange()[0].slice(0,7) ? '本月' : (curMo + '月');

  var monthTx = filterByDate(allTx, curStart, curEnd);
  var expTx = monthTx.filter(function(t){return !isIncome(t);});

    detailHtml = '<div class="empty-state"><div class="icon">📭</div><div>' + label + '暂无记录</div></div>';
  } else {
    var expTotal = calcExpense(monthTx);
    var incTotal = calcIncome(monthTx);
    var grouped = groupByCategory(expTx);
    var incGrouped = groupByCategory(incTx);
    var catOrder = Object.keys(grouped).sort(function(a,b) { return grouped[b] - grouped[a]; });
    var incCatOrder = Object.keys(incGrouped).sort(function(a,b) { return incGrouped[b] - incGrouped[a]; });

    detailHtml = '<div class="day-summary">' +
      '<div class="row"><span class="label">' + label + '支出</span><span class="val exp">¥' + fmt(expTotal) + '</span></div>' +
      '<div class="row"><span class="label">' + label + '收入</span><span class="val inc">¥' + fmt(incTotal) + '</span></div>' +
      '<div class="row"><span class="label">' + label + '笔数</span><span class="val" style="color:var(--text)">' + monthTx.length + ' 笔</span></div>' +
    '</div>';

    // 支出分类
    if (catOrder.length > 0) {
      detailHtml += '<div class="card"><div class="card-title">📂 支出分类</div><div class="cat-grid">';
      catOrder.forEach(function(cat) {
        var cfg = catConfig[cat] || {emoji:'📦',color:'#888'};
        var amt = grouped[cat];
        var pct = expTotal > 0 ? (amt/expTotal*100).toFixed(1) : 0;
        detailHtml += '<div class="cat-item">' +
          '<div style="position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px;background:' + cfg.color + '"></div>' +
          '<div class="cat-icon">' + cfg.emoji + '</div>' +

          '<div class="cat-amount">¥' + fmt(amt) + '</div>' +
          '<div class="cat-pct">' + pct + '%</div>' +
        '</div>';
      });
      detailHtml += '</div></div>';
    }

    // 收入分类
    if (incCatOrder.length > 0) {
      detailHtml += '<div class="card"><div class="card-title">💰 收入分类</div><div class="cat-grid">';
      incCatOrder.forEach(function(cat) {
        var cfg = incomeCatConfig[cat] || {emoji:'💰',color:'#34D399'};
        var amt = incGrouped[cat];
        var pct = incTotal > 0 ? (amt/incTotal*100).toFixed(1) : 0;
        detailHtml += '<div class="cat-item">' +
          '<div style="position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px;background:' + cfg.color + '"></div>' +

      expTx.slice().reverse().forEach(function(t) {

    }
  }

  panel.innerHTML = compareHtml + detailHtml;
}

      <input type="date" id="filterEnd" style="display:none" onchange="applyFilter()">
    </div>
    <div id="detailList"></div>`;
  panel.innerHTML = html;
  applyFilter();

function onPresetChange() {
  const v = document.getElementById('filterPreset').value;
  const s = document.getElementById('filterStart');
  const e = document.getElementById('filterEnd');
  const sep = document.getElementById('filterSep');

  if (v === 'custom') {
    s.style.display = '';
    e.style.display = '';
    sep.style.display = '';
    s.value = '2026-06-01';
    e.value = '2026-08-31';
    applyFilter();
  } else {
    s.style.display = 'none';
    e.style.display = 'none';
    sep.style.display = 'none';
    applyFilter();
  }
}

function applyFilter() {
  const preset = document.getElementById('filterPreset').value;
  let start = '', end = '9999-12-31';

  if (preset === 'jun') { start = '2026-06-01'; end = '2026-06-30'; }
  else if (preset === 'jul') { start = '2026-07-01'; end = '2026-07-31'; }
  else if (preset === 'aug') { start = '2026-08-01'; end = '2026-08-31'; }
  else if (preset === 'custom') {
    start = document.getElementById('filterStart').value || '2026-06-01';
    end = document.getElementById('filterEnd').value || '2026-08-31';
  }

  const allTx = filterByDate(getAllTx(), start || '0000-01-01', end);
  const expTotal = calcExpense(allTx);
  const incTotal = calcIncome(allTx);

  // Combine and sort
  const all = allTx.slice().sort((a,b) => b.date.localeCompare(a.date) || (isIncome(a) ? -1 : 1));

  let html = `
    <div class="day-summary">
      <div class="row"><span class="label">支出合计</span><span class="val exp">¥${fmt(expTotal)}</span></div>
      <div class="row"><span class="label">收入合计</span><span class="val inc">¥${fmt(incTotal)}</span></div>
      <div class="row"><span class="label">共 ${all.length} 笔</span><span class="val" style="color:var(--text-3);font-size:13px">${start||'起始'} ~ ${end==='9999-12-31'?'至今':end}</span></div>
    </div>
    <div class="card"><div class="tx-list">`;

  all.forEach(t => {
    if (isIncome(t)) {
      const cfg = incomeCatConfig[t.category] || {emoji:'💰',color:'#34D399'};
      html += `
        <div class="tx-item">
          <div class="tx-emoji">${cfg.emoji}</div>
          <div class="tx-left">
            <div class="tx-name">${t.item}</div>
            <div class="tx-meta">${formatDate(t.date)} · ${t.category}</div>
          </div>
          <div class="tx-amount income">+¥${fmt(t.amount)}</div>
        </div>`;
    } else {
      const cfg = catConfig[t.category] || {emoji:'📦',color:'#888'};
      html += `
        <div class="tx-item">
          <div class="tx-emoji">${cfg.emoji}</div>
          <div class="tx-left">
            <div class="tx-name">${t.item}</div>
            <div class="tx-meta">${formatDate(t.date)} · ${t.category}</div>
          </div>
          <div class="tx-amount expense">-¥${fmt(t.amount)}</div>
        </div>`;
    }
  });

  html += `</div></div>`;
  document.getElementById('detailList').innerHTML = html;
}

// 格局判断
function checkGeju(dp,tp,mp,sp,hg,hz){
  const tags=[];let f=false;const fr=[];
  const x=getXun(hg,hz);const dg=DUN[x];
  let sg=null;for(const[g,gn]of Object.entries(dp))if(gn===hg){sg=parseInt(g);break;}
  if(hg==='甲')for(const[g,gn]of Object.entries(dp))if(gn===dg){sg=parseInt(g);break;}
  if(sg===5)sg=2;
  // 凶格过滤
  if(sg&&mp[sg]){const m=mp[sg];if(WX_KE[MEN_WX[m]]===GONG_WX[sg]){f=true;fr.push('门迫');}}
  const kw=getKongWang(hg,hz);const kg=kw.map(z=>{let g=ZHI_GONG[z];return g===5?2:g;});
  if(sg&&kg.includes(sg)){f=true;fr.push('空亡');}
  if(sg){const tg=tp[sg];if(XING_MAP[tg]===sg){f=true;fr.push('击刑');}}
  // 吉格判定——遍历九宫
  for(const g of Object.keys(tp)){
    const gi=parseInt(g);if(gi===5)continue;
    const tg=tp[g],dgn=dp[g],m=mp[g],sh=sp[g];
    // 三奇得使：天盘乙丙丁+地盘旬首遁干
    if(['乙','丙','丁'].includes(tg)&&dgn===dg)tags.push('三奇得使('+tg+')');
    // 玉女守门：丁+开门
    if(tg==='丁'&&m==='开')tags.push('玉女守门');
    // 人遁：丁+休门+太阴
    if(tg==='丁'&&m==='休'&&sh==='太阴')tags.push('人遁');
    // 天遁：丙+生门+地盘丁
    if(tg==='丙'&&m==='生'&&dgn==='丁')tags.push('天遁');
    // 地遁：乙+开门+地盘己
    if(tg==='乙'&&m==='开'&&dgn==='己')tags.push('地遁');
    // 神遁：丙+生门+九天
    if(tg==='丙'&&m==='生'&&sh==='九天')tags.push('神遁');
    // 鬼遁：丁+杜门+九地 或 丁+开门+九地
    if(tg==='丁'&&(m==='杜'||m==='开')&&sh==='九地')tags.push('鬼遁');
    // 龙遁：乙+开/休/生+地盘癸或坎宫
    if(tg==='乙'&&(m==='开'||m==='休'||m==='生')&&(dgn==='癸'||gi===1))tags.push('龙遁');
    // 虎遁：乙+休/生+地盘辛+艮宫
    if(tg==='乙'&&(m==='休'||m==='生')&&dgn==='辛'&&gi===8)tags.push('虎遁');
    // 三诈：三吉门(开/休/生)+三奇(乙/丙/丁)+八神
    if((m==='开'||m==='休'||m==='生')&&['乙','丙','丁'].includes(tg)){
      if(sh==='太阴')tags.push('真诈');
      else if(sh==='九地')tags.push('重诈');
      else if(sh==='六合')tags.push('休诈');
    }
    // 三奇升殿：乙临震3宫/丙临离9宫/丁临兑7宫
    if(tg==='乙'&&gi===3)tags.push('乙奇升殿');
    if(tg==='丙'&&gi===9)tags.push('丙奇升殿');
    if(tg==='丁'&&gi===7)tags.push('丁奇升殿');
  }
  // 去重
  const ut=[...new Set(tags)];
  return{tags:ut,isFiltered:f,filterReason:fr,shiganGong:sg};
}

function paiPan(ds,hz){const dg=getDayGZ(ds);const hg=getHourGZ(dg.gan,hz);const{jq,yuan}=getJieqiYuan(ds);const ju=getJu(jq,yuan);const isYang=YANG_DUN.has(jq);const dp=flyGong(ju,isYang);const{tpan,zhifuGong}=getTianpan(dp,hg.gan,hz,isYang);const mp=getBamen(zhifuGong,hg.gan,hz,isYang);const sp=getBashen(zhifuGong,isYang);const{tags,isFiltered,filterReason,shiganGong}=checkGeju(dp,tpan,mp,sp,hg.gan,hz);return{date:ds,hourZhi:hz,dayGz:dg.gz,hourGz:hg.gz,jq,yuan,ju,isYang,shiganGong,tpanGan:tpan[shiganGong]||'?',menAtGong:mp[shiganGong]||'?',shenAtGong:sp[shiganGong]||'?',tags,isFiltered,filterReason};}

function getWeekDates(){const t=new Date();const dow=t.getDay()||7;const m=new Date(t);m.setDate(t.getDate()-dow+1);const dates=[];for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);dates.push(d.toISOString().slice(0,10));}return dates;}
function getWeekNumber(){const t=new Date();const s=new Date(t.getFullYear(),0,1);return Math.ceil(((t-s)/86400000+s.getDay()+1)/7);}
function generateWeekSchedule(){
  const dates=getWeekDates();
  const accounts=PZ_ACCOUNTS.map(a=>({...a,rg:getAccountRg(a.created),isSanqi:['乙','丙','丁'].includes(getAccountRg(a.created))}));

    const kw=getKongWang(hg.gan,'子');
    days.push({dt:dateStr.slice(5).replace('-','/'),wd:wdN[wd-1],dateStr,gz:sample.dayGz,jq:sample.jq,yuan:sample.yuan,ju:sample.ju,isYang:sample.isYang,isWeekend,kwStr:kw.join('')});
    const hours=isWeekend?['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥']:['戌','亥','子'];
    accounts.forEach(a=>{
      hours.forEach(hz=>{
        if([1,3,4].includes(wd)&&hz==='亥')return;

        const entry={dateStr,dt:dateStr.slice(5).replace('-','/')+'('+wdN[wd-1]+')',t:HOUR_LABELS[hz],gong:GONG_NM[r.shiganGong]||'?',men:r.menAtGong+'门',tag:r.tags.join('+'),pri:r.tags.length>0?'A':'B',shiganGan:r.tpanGan,shen:r.shenAtGong};
        if(r.isFiltered){filtered[a.name].push({...entry,reason:r.filterReason[0]});}
        else{let sqm=false;if(a.isSanqi)r.tags.forEach(t=>{if(t.includes('三奇得使')&&t.includes(a.rg))sqm=true;});entry.sanqiMatch=sqm;recommend[a.name].push(entry);}
      });
    });
  });
  return{accounts,days,recommend,filtered};
}
// 判断排盘条目是否在未来（基于 dateStr 和时辰）
function getHourRange(t){
  const m=t.match(/(\d+)-(\d+)/);
  if(!m)return[0,24];
  let s=parseInt(m[1]),e=parseInt(m[2]);
  if(e<s)e+=24; // 跨子时
  return[s,e];
}
function isFutureEntry(entry){
  const now=new Date();
  const d=new Date(entry.dateStr+'T00:00:00');
  const todayStr=now.toISOString().slice(0,10);
  if(entry.dateStr>todayStr)return true;
  if(entry.dateStr<todayStr)return false;
  const[hs,he]=getHourRange(entry.t);
  const curH=now.getHours()+now.getMinutes()/60;
  // 跨子时条目（23-01），结束小时为25；只要当前小时<结束小时即可
  return curH<he;
}
// 翻牌建议
function generateFlipAdvice(schedule){
  const advice={};
  const PN=['左一','左二','中','右二','右一'];
  const SR={'值符':5,'九天':4,'太阴':3,'六合':3,'九地':2,'白虎':1,'玄武':1,'腾蛇':0};
  schedule.accounts.forEach(a=>{
    const recs=schedule.recommend[a.name]||[];
    const future=recs.filter(isFutureEntry);
    const pool=future.length>0?future:recs;
    if(pool.length===0){advice[a.name]={pos:'无推荐',reason:'本周无可用吉时，建议下周再试'};return;}
    const best=pool.find(r=>r.sanqiMatch)||pool.find(r=>r.pri==='A')||pool[0];
    const sr=SR[best.shen]||0;
    let pi;if(sr>=4)pi=2;else if(sr>=3)pi=1;else if(sr>=2)pi=3;else if(sr>=1)pi=0;else pi=4;
    const isPast=!isFutureEntry(best);
    advice[a.name]={pos:PN[pi],posIdx:pi,isPast,bestTime:best.dt+' '+best.t,gong:best.gong,men:best.men,tag:best.tag||'★吉门',shen:best.shen,reason:best.shen+'加临'+best.gong+'，'+best.men+'当位'+(best.sanqiMatch?'，三奇得使⚡':'')+(isPast?' · 当前无未来吉时，显示最近可用':'')};
  });
  return advice;
}

    else if(t.includes('玉女守门')) cls = 'yunu';
    else if(t.includes('诈')) cls = 'yunu';
    return '<span class="jige-chip '+cls+'">'+t.replace(/★/g,'')+'</span>';
  }).join('');
}

// 吉格数量统计（用于排序）
function jigeCount(tagStr){
  if(!tagStr) return 0;
  return tagStr.split('+').filter(s => s.trim()).length;
}

function renderPZRecommend() {
  const sch = getPZSchedule();
  const flipAdvice = generateFlipAdvice(sch);
  const weekNum = getWeekNumber();
  const firstDay = sch.days[0];
  const lastDay = sch.days[sch.days.length-1];

  let html = `<div class="card">
    <div class="card-title">🔮 第${weekNum}周（${firstDay.dt}-${lastDay.dt}）试炼排盘</div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:12px">奇门遁甲·动态排盘引擎 | 已过滤凶格（门迫+空亡+击刑）</div>
    <div class="day-summary">`;

  // 按节气+局数分组显示
  const jqGroups = {};
  sch.days.forEach(d => {
    const key = `${d.jq}${d.yuan}`;
    if(!jqGroups[key]) jqGroups[key] = {days:[], ju:d.ju, isYang:d.isYang, jq:d.jq, yuan:d.yuan};
    jqGroups[key].days.push(d.dt);
  });
  Object.values(jqGroups).forEach(g => {
    const yd = g.isYang ? '阳' : '阴';
    const color = g.isYang ? 'var(--orange)' : 'var(--purple)';
    html += `<div class="row"><span class="label">${g.days[0]}-${g.days[g.days.length-1]}</span><span class="val" style="color:${color};font-size:14px">${g.jq}${g.yuan} · ${yd}遁${g.ju}局</span></div>`;
  });
  html += `</div></div>`;

  // 翻牌建议总览
  html += `<div class="card">
    <div class="card-title">🃏 翻牌建议</div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:10px">打完Boss出5张牌，根据八神推荐翻牌位置</div>`;
  sch.accounts.forEach(a => {
    const adv = flipAdvice[a.name];
    const sqTag = a.isSanqi ? '<span style="color:var(--yellow);font-size:11px;margin-left:6px">⚡三奇</span>' : '';
    html += `<div style="background:var(--inset);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;border-left:4px solid ${adv.posIdx!==undefined?'var(--blue)':'var(--red)'}">
      <div style="font-size:13px;font-weight:600;margin-bottom:4px">${a.icon} ${a.name}（${a.school}·日干${a.rg}）${sqTag}</div>`;
    if(adv.posIdx !== undefined){
      const pastBadge = adv.isPast ? '<span style="color:var(--red);font-size:10px;margin-left:6px">已过期</span>' : '';
      html += `<div style="display:flex;align-items:center;gap:8px;margin:6px 0">
        <div style="font-size:11px;color:var(--text-3)">推荐翻牌：</div>
        <div style="font-size:18px;font-weight:700;color:var(--blue)">${adv.pos}</div>
        <div style="font-size:11px;color:var(--text-2)">${adv.reason}</div>
      </div>
      <div style="font-size:12px;color:var(--text-2)">⏰ ${adv.bestTime} ${pastBadge} · ${adv.gong} ${adv.men} ${adv.tag}</div>`;
    } else {
      html += `<div style="font-size:12px;color:var(--red)">⚠️ ${adv.reason}</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;

  // 每个账号的推荐时段
  sch.accounts.forEach(acc => {
    const recs = sch.recommend[acc.name] || [];
    const future = recs.filter(isFutureEntry);
    // 按吉格数量降序排序，多重buff优先
    const sortByJige = (a,b) => {
      const ja = jigeCount(a.tag), jb = jigeCount(b.tag);
      if(jb !== ja) return jb - ja;
      if(a.sanqiMatch && !b.sanqiMatch) return -1;
      if(!a.sanqiMatch && b.sanqiMatch) return 1;
      return 0;
    };
    const sortedFuture = future.slice().sort(sortByJige);
    const sortedAll = recs.slice().sort(sortByJige);
    const best = sortedFuture[0] || sortedAll[0];
    const sqTag = acc.isSanqi ? '<span style="color:var(--yellow);font-size:11px;margin-left:6px">⚡三奇</span>' : '';
    html += `<div class="card">
      <div class="card-title">${acc.icon} ${acc.name}（${acc.school}·日干${acc.rg}）${sqTag}</div>`;
    if (best) {
      const isPast = !isFutureEntry(best);
      const jc = jigeCount(best.tag);
      const isSqMatch = best.sanqiMatch;
      const borderColor = isSqMatch ? 'var(--yellow)' : (jc >= 2 ? 'var(--yellow)' : 'var(--green)');
      const label = isPast ? '🕓 最近可用' : '🎯 首选';
      const buffBadge = jc >= 2 ? '<span class="jige-count">'+jc+'重buff</span>' : '';
      html += `<div style="background:var(--inset);border-radius:var(--radius-sm);padding:14px;margin-bottom:10px;border-left:4px solid ${borderColor}">
        <div style="font-size:11px;color:var(--text-3);margin-bottom:4px">${label}${isSqMatch?' ⚡三奇得使':''}${buffBadge}${isPast?' <span style="color:var(--red)">(已过期)</span>':''}</div>
        <div style="font-size:16px;font-weight:700;color:var(--text)">${best.dt} ${best.t}</div>
        <div style="font-size:13px;color:var(--text-2);margin-top:4px">${best.gong} ${best.men} · ${best.shen}</div>
        <div class="jige-chips">${renderJigeChips(best.tag)}</div>
      </div>`;
    }
    const displayRecs = sortedFuture.length > 0 ? sortedFuture : sortedAll;
    if (displayRecs.length > 0) {
      const showAll = displayRecs.length <= 8;
      html += `<div style="font-size:12px;color:var(--text-2);margin-bottom:6px">${sortedFuture.length > 0 ? '未来可用' : '全部可用'} ${displayRecs.length} 个时段（按吉格数量排序）：</div>`;
      displayRecs.forEach((r, idx) => {
        if(!showAll && idx >= 6){
          return;
        }
        const c = r.sanqiMatch ? 'var(--yellow)' : (r.pri === 'A' ? 'var(--yellow)' : 'var(--text-2)');
        const sqIcon = r.sanqiMatch ? '⚡' : '';
        const jc = jigeCount(r.tag);
        const buffBadge = jc >= 2 ? '<span class="jige-count">'+jc+'重</span>' : '';
        html += `<div style="font-size:12px;color:var(--text-3);padding:6px 0;border-bottom:1px solid var(--bdr)">
          <div style="display:flex;align-items:center;gap:4px"><span style="color:${c};font-weight:600">${sqIcon}${r.dt}</span> ${r.t} · ${r.gong}${r.men} · ${r.shen}${buffBadge}</div>
          <div class="jige-chips">${renderJigeChips(r.tag)}</div>
        </div>`;
      });
      if(!showAll){
        html += `<div style="font-size:11px;color:var(--text-3);margin-top:4px">等 ${displayRecs.length - 6} 个更多时段，详见吉时表...</div>`;
      }
    } else {
      html += `<div style="font-size:13px;color:var(--red);padding:10px 0">⚠️ 本周无可用吉时</div>`;
    }
    html += `</div>`;
  });

  // 凶格过滤汇总
  const totalFiltered = Object.values(sch.filtered).reduce((s, a) => s + a.length, 0);
  html += `<div class="card">
    <div class="card-title" style="color:var(--red)">⚠️ 凶格过滤</div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:8px">共排除 ${totalFiltered} 个吉门时段（门迫/空亡/击刑）</div>`;
  sch.accounts.forEach(acc => {
    const items = sch.filtered[acc.name] || [];
    if (items.length > 0) {
      html += `<div style="font-size:12px;color:var(--text-2);margin-bottom:4px;margin-top:8px">${acc.name} 被排除 ${items.length} 个：</div>`;
      items.slice(0, 3).forEach(f => {
        html += `<div style="font-size:11px;color:var(--text-3);padding:2px 0">· ${f.dt} ${f.t} ${f.gong}${f.men} ← ${f.reason}</div>`;
      });
      if (items.length > 3) html += `<div style="font-size:11px;color:var(--text-3)">...等共 ${items.length} 个</div>`;
    }
  });
  html += `</div>`;

  document.getElementById('sub-pz-recommend').innerHTML = html;
}

// ========== INIT ==========


function saveTransactions() {
  localStorage.setItem('comprehensive_transactions', JSON.stringify(transactions));
}

function recalcTotals() {
  const allTx = getAllTx();
  totalExpense = allTx.filter(t=>!isIncome(t)).reduce((sum, t) => sum + (t.amount||0), 0);
  totalIncome = allTx.filter(t=>isIncome(t)).reduce((sum, t) => sum + (t.amount||0), 0);
  balance = totalIncome - totalExpense;
  // catTotals 兼容（仅支出）
  catTotals = {};
  allTx.filter(t=>!isIncome(t)).forEach(t => {
    if (t.category && t.amount > 0) catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
  });
}

// 当前记账类型（expense/income）
let currentTxType = 'expense';

function fillCategoryOptions(type) {
  const sel = document.getElementById('add-category');
  sel.innerHTML = '<option value="">请选择</option>';
  const cats = type === 'income' ? incomeCatOrder : allCatOrder;
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    sel.appendChild(opt);
  });
}

function switchTxType(type) {
  currentTxType = type;
  const expBtn = document.getElementById('type-expense-btn');
  const incBtn = document.getElementById('type-income-btn');
  if(type === 'expense'){
    expBtn.style.background = 'var(--red)';
    expBtn.style.color = '#fff';
    incBtn.style.background = 'var(--inset)';
    incBtn.style.color = 'var(--text-2)';
  } else {
    incBtn.style.background = 'var(--green)';
    incBtn.style.color = '#0f1115';
    expBtn.style.background = 'var(--inset)';
    expBtn.style.color = 'var(--text-2)';
  }
  fillCategoryOptions(type);
}

function refreshAllViews() {
  recalcTotals();
  renderOverview();
  renderMonth();
  renderDetail();
}

function confirmTransaction() {
  const date = document.getElementById('add-date').value;
  const amount = parseFloat(document.getElementById('add-amount').value);
  const category = document.getElementById('add-category').value;
  const item = document.getElementById('add-item').value;
  
  if (!date || !amount || amount <= 0 || !item || !category) return;
  
  transactions.push({date: date, category: category, item: item, amount: amount, type: currentTxType});
  saveTransactions();
  
  // Reset form
  document.getElementById('add-amount').value = '';
  document.getElementById('add-category').value = '';
  document.getElementById('add-item').value = '';
  // Reset date to today
  var today = new Date().toISOString().slice(0,10);
  document.getElementById('add-date').value = today;
  
  // Hide confirm, show form
  document.getElementById('add-confirm').style.display = 'none';
  document.getElementById('add-form').style.display = 'flex';
  
  // Show success toast
  const msg = document.createElement('div');
  msg.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#00E676;color:#000;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:9999';
  msg.textContent = '✓ 已录入成功';
  document.body.appendChild(msg);
  setTimeout(function(){ msg.remove(); }, 2000);
  
  refreshAllViews();
}

function cancelPreview() {
  document.getElementById('add-confirm').style.display = 'none';
  document.getElementById('add-form').style.display = 'flex';
}

function init() {
  recalcTotals();
  // Set header date
  const now = new Date();
  document.getElementById('headerDate').textContent = now.toISOString().slice(0,10);
  // Set default date for add form
  document.getElementById('add-date').value = now.toISOString().slice(0,10);
  // Initialize category options
  switchTxType('expense');

  renderOverview();
  renderMonth();
  renderDetail();
  renderDaigou();
  renderPZRecommend();
  renderPZDetail();
  renderPZInfo();
}

function previewTransaction() {
  const date = document.getElementById('add-date').value;
  const amount = parseFloat(document.getElementById('add-amount').value);
  const category = document.getElementById('add-category').value;
  const item = document.getElementById('add-item').value;
  
  if (!date || !amount || amount <= 0 || !item) {
    const msg = document.createElement('div');
    msg.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#ff3b30;color:white;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:9999';
    msg.textContent = '请填写完整信息';
    document.body.appendChild(msg);
    setTimeout(() => msg.remove(), 2000);
    return;
  }
  if (!category) {
    const msg = document.createElement('div');
    msg.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#ff3b30;color:white;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:9999';
    msg.textContent = '请选择分类';
    document.body.appendChild(msg);
    setTimeout(() => msg.remove(), 2000);
    return;
  }
  
  const typeLabel = currentTxType === 'income' ? '💰 收入' : '💸 支出';
  const amountPrefix = currentTxType === 'income' ? '+' : '-';
  document.getElementById('confirm-detail').innerHTML = '📅 日期：' + date + '<br>' + typeLabel + '：' + amountPrefix + '¥' + amount.toFixed(2) + '<br>📂 分类：' + category + '<br>📝 备注：' + item;
  document.getElementById('add-form').style.display = 'none';
  document.getElementById('add-confirm').style.display = 'block';
}
init();</script>
