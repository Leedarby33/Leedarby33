<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>综合工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,'SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;background:#f5f5f7;color:#1d1d1f;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:root{--bg:#f5f5f7;--card:#ffffff;--inset:#f0f0f2;--t1:#1d1d1f;--t2:#86868b;--t3:#aeaeb2;--blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;--teal:#5ac8fa;--yellow:#ffcc00;--pink:#ff2d55;--bdr:rgba(0,0,0,0.06);--bdr2:rgba(0,0,0,0.12);--r:14px;--rs:10px}
.container{max-width:480px;margin:0 auto;padding:0 16px 80px}
.header{position:sticky;top:0;z-index:100;background:rgba(245,245,247,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff}
.header-title{font-size:15px;font-weight:600;color:var(--t1)}
.header-sub{font-size:11px;color:var(--t2);margin-top:1px}
.header-date{font-size:11px;color:var(--t3);text-align:right}
.main-tabs{position:sticky;top:56px;z-index:99;background:rgba(245,245,247,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;gap:0;padding:10px 16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--bdr)}
.main-tabs::-webkit-scrollbar{display:none}
.main-tab{flex-shrink:0;padding:10px 24px;border-radius:12px 12px 0 0;font-size:14px;font-weight:600;color:var(--t2);background:transparent;border:1px solid transparent;border-bottom:none;cursor:pointer;transition:all 0.2s}
.main-tab.active{color:var(--t1);background:var(--card);border-color:var(--bdr2)}
.main-panel{display:none}
.main-panel.active{display:block}
.sub-tabs{display:flex;gap:6px;padding:12px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.sub-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;color:var(--t2);background:transparent;border:1px solid transparent;transition:all 0.2s;white-space:nowrap;cursor:pointer}
.sub-tab.active{color:var(--t1);background:var(--card);border-color:var(--bdr2)}
.sub-panel{display:none}
.sub-panel.active{display:block;animation:fadeUp 0.3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:12px;border:1px solid var(--bdr)}
.card-title{font-size:14px;font-weight:600;color:var(--t1);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.big-num{font-size:36px;font-weight:800;color:var(--t1);line-height:1.1}
.big-num .unit{font-size:14px;font-weight:400;color:var(--t2)}
.big-sub{font-size:12px;color:var(--t2);margin-top:4px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kpi-item{background:var(--inset);border-radius:var(--rs);padding:16px 12px;text-align:center}
.kpi-value{font-size:22px;font-weight:700}
.kpi-value.income{color:var(--green)}
.kpi-value.expense{color:var(--red)}
.kpi-value.balance{color:var(--blue)}
.kpi-label{font-size:11px;color:var(--t2);margin-top:4px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat-item{background:var(--inset);border-radius:var(--rs);padding:14px;position:relative;overflow:hidden}
.cat-item::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px}
.cat-icon{font-size:16px;margin-bottom:4px}
.cat-name{font-size:12px;color:var(--t2);margin-bottom:2px}
.cat-amount{font-size:18px;font-weight:700;color:var(--t1)}
.cat-pct{font-size:11px;color:var(--t3);margin-top:2px}
.tx-list{display:flex;flex-direction:column;gap:0}
.tx-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid var(--bdr)}
.tx-item:last-child{border-bottom:none}
.tx-left{flex:1;min-width:0}
.tx-name{font-size:13px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--t3);margin-top:2px}
.tx-amount{font-size:15px;font-weight:600;white-space:nowrap;margin-left:12px}
.tx-amount.income{color:var(--green)}
.tx-amount.expense{color:var(--t2)}
.tx-emoji{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--inset);margin-right:10px;flex-shrink:0}
.section-title{font-size:13px;font-weight:600;color:var(--blue);margin:16px 0 10px;padding-left:2px}
.empty-state{text-align:center;padding:40px 20px;color:var(--t3);font-size:13px}
.empty-state .icon{font-size:40px;margin-bottom:12px;opacity:0.5}
.date-filter{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.date-filter input{background:var(--inset);color:var(--t1);border:1px solid var(--bdr);border-radius:8px;padding:8px 10px;font-size:13px;outline:none;flex:1}
.date-filter span{color:var(--t3);font-size:12px;flex-shrink:0}
.date-filter select{background:var(--inset);color:var(--t1);border:1px solid var(--bdr);border-radius:8px;padding:8px 10px;font-size:13px;outline:none}
.day-summary{background:var(--inset);border-radius:var(--rs);padding:14px;margin-bottom:12px}
.day-summary .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.day-summary .row:last-child{margin-bottom:0}
.day-summary .label{font-size:12px;color:var(--t2)}
.day-summary .val{font-size:16px;font-weight:700}
.day-summary .val.inc{color:var(--green)}
.day-summary .val.exp{color:var(--red)}
.month-compare{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.month-card{background:var(--inset);border-radius:var(--rs);padding:16px;text-align:center}
.month-card .month-name{font-size:12px;color:var(--t2);margin-bottom:8px}
.month-card .month-exp{font-size:20px;font-weight:700;color:var(--red);margin-bottom:4px}
.month-card .month-inc{font-size:14px;font-weight:600;color:var(--green)}
.month-card .month-bal{font-size:12px;color:var(--t3);margin-top:4px}
.income-section{background:var(--inset);border-radius:var(--rs);padding:14px;margin-top:12px}
.income-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bdr)}
.income-row:last-child{border-bottom:none}
.income-row .name{font-size:13px;color:var(--t2)}
.income-row .amt{font-size:14px;font-weight:600;color:var(--green)}
.income-total{display:flex;justify-content:space-between;align-items:center;padding-top:10px;margin-top:6px;border-top:1px solid var(--bdr2)}
.income-total .name{font-size:14px;font-weight:600;color:var(--t1)}
.income-total .amt{font-size:18px;font-weight:700;color:var(--green)}
.progress-bar{height:6px;background:var(--inset);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:3px;transition:width 0.6s ease}
.pz-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--t3);text-align:center}
.pz-placeholder .icon{font-size:60px;margin-bottom:16px;opacity:0.3}
.pz-placeholder .title{font-size:16px;color:var(--t2);margin-bottom:8px}
.pz-placeholder .desc{font-size:12px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <div class="avatar">综</div>
      <div>
        <div class="header-title">综合工作台</div>
        <div class="header-sub">排盘 · 记账 · 待购入 · 训练</div>
      </div>
    </div>
    <div class="header-date" id="headerDate"></div>
  </div>

  <div class="main-tabs">
    <div class="main-tab" data-main="paipan" onclick="switchMain('paipan')">排盘</div>
    <div class="main-tab active" data-main="jizhang" onclick="switchMain('jizhang')">记账</div>
    <div class="main-tab" data-main="daigou" onclick="switchMain('daigou')">待购入</div>
    <div class="main-tab" data-main="training" onclick="switchMain('training')">训练</div>
  </div>

  <!-- 排盘 Panel -->
  <div class="main-panel" id="panel-paipan">
    <div class="sub-tabs">
      <div class="sub-tab active" data-sub="pz-recommend" onclick="switchSub('pz-recommend')">推荐</div>
      <div class="sub-tab" data-sub="pz-detail" onclick="switchSub('pz-detail')">吉时表</div>
      <div class="sub-tab" data-sub="pz-info" onclick="switchSub('pz-info')">排盘信息</div>
    </div>
    <div class="sub-panel active" id="sub-pz-recommend"></div>
    <div class="sub-panel" id="sub-pz-detail"></div>
    <div class="sub-panel" id="sub-pz-info"></div>
  </div>

  <!-- 记账 Panel -->
  <div class="main-panel active" id="panel-jizhang">
    <div class="sub-tabs">
      <div class="sub-tab active" data-sub="overview" onclick="switchSub('overview')">总览</div>
      <div class="sub-tab" data-sub="add" onclick="switchSub('add')">+ 记账</div>
      <div class="sub-tab" data-sub="today" onclick="switchSub('today')">当日</div>
      <div class="sub-tab" data-sub="week" onclick="switchSub('week')">当周</div>
      <div class="sub-tab" data-sub="month" onclick="switchSub('month')">当月</div>
      <div class="sub-tab" data-sub="detail" onclick="switchSub('detail')">明细</div>
    </div>

    <!-- 总览 -->
    <div class="sub-panel active" id="sub-overview"></div>

    <!-- 当日 -->
    <div class="sub-panel" id="sub-today"></div>

    <!-- 当周 -->
    <div class="sub-panel" id="sub-week"></div>

    <!-- 当月 -->
    <div class="sub-panel" id="sub-month"></div>

    <!-- 明细 -->
    <div class="sub-panel" id="sub-detail"></div>

    <!-- 记账 -->
    <div class="sub-panel" id="sub-add">
      <div class="card" style="padding:20px">
        <h3 style="margin:0 0 16px 0;font-size:16px;font-weight:600">新增支出</h3>
        <div id="add-form" style="display:flex;flex-direction:column;gap:12px">
          <div>
            <label style="display:block;font-size:13px;color:var(--t2);margin-bottom:4px">日期</label>
            <input type="date" id="add-date" style="width:100%;padding:10px;border:1px solid var(--bdr2);border-radius:8px;font-size:14px">
          </div>
          <div>
            <label style="display:block;font-size:13px;color:var(--t2);margin-bottom:4px">金额 (元)</label>
            <input type="number" id="add-amount" step="0.01" placeholder="0.00" style="width:100%;padding:10px;border:1px solid var(--bdr2);border-radius:8px;font-size:14px">
          </div>
          <div>
            <label style="display:block;font-size:13px;color:var(--t2);margin-bottom:4px">分类</label>
            <select id="add-category" style="width:100%;padding:10px;border:1px solid var(--bdr2);border-radius:8px;font-size:14px">
              <option value="">请选择分类</option>
              <option value="餐饮">餐饮</option>
              <option value="交通">交通</option>
              <option value="娱乐">娱乐</option>
              <option value="固定支出">固定支出</option>
              <option value="补剂">补剂</option>
              <option value="训练">训练</option>
              <option value="个人护理">个人护理</option>
              <option value="个人生活">个人生活</option>
              <option value="数码产品">数码产品</option>
            </select>
          </div>
          <div>
            <label style="display:block;font-size:13px;color:var(--t2);margin-bottom:4px">备注</label>
            <input type="text" id="add-item" placeholder="消费项目" style="width:100%;padding:10px;border:1px solid var(--bdr2);border-radius:8px;font-size:14px">
          </div>
          <button onclick="previewTransaction()" style="margin-top:8px;padding:12px;background:var(--blue);color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer">预览</button>
        </div>
        <div id="add-confirm" style="display:none;margin-top:16px">
          <div style="background:var(--bg);border-radius:12px;padding:16px;margin-bottom:16px">
            <div style="font-size:13px;color:var(--t2);margin-bottom:8px">请确认以下记账信息：</div>
            <div id="confirm-detail" style="font-size:15px;font-weight:500;line-height:1.8"></div>
          </div>
          <div style="display:flex;gap:12px">
            <button onclick="confirmTransaction()" style="flex:1;padding:12px;background:var(--blue);color:white;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer">✓ 确认录入</button>
            <button onclick="cancelPreview()" style="flex:1;padding:12px;background:var(--bdr2);color:var(--t1);border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer">取消</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 待购入 Panel -->
  <div class="main-panel" id="panel-daigou"></div>

  <!-- 训练 Panel -->
  <div class="main-panel" id="panel-training">
    <div class="sub-tabs">
      <div class="sub-tab active" data-sub="tr-today" onclick="switchSub('tr-today')">今日训练</div>
      <div class="sub-tab" data-sub="tr-week" onclick="switchSub('tr-week')">本周计划</div>
      <div class="sub-tab" data-sub="tr-lib" onclick="switchSub('tr-lib')">动作库</div>
    </div>
    <div class="sub-panel active" id="sub-tr-today"></div>
    <div class="sub-panel" id="sub-tr-week"></div>
    <div class="sub-panel" id="sub-tr-lib"></div>
  </div>
</div>

// ========== HELPERS ==========
function fmt(n) { return n.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtWan(n) { if(Math.abs(n)>=10000) return (n/10000).toFixed(2)+'万'; return fmt(n); }

function formatDate(d) {
  const parts = d.split('-');
  return parseInt(parts[1]) + '/' + parseInt(parts[2]);
}

function isToday(dateStr) {
  const now = new Date();
  const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0'), d = String(now.getDate()).padStart(2,'0');
  return dateStr === `${y}-${m}-${d}`;
}

function getWeekRange() {
  const now = new Date();
  const day = now.getDay() || 7;
  const mon = new Date(now);
  mon.setDate(now.getDate() - day + 1);
  const sun = new Date(mon);
  sun.setDate(mon.getDate() + 6);
  const f = d => d.toISOString().slice(0,10);
  return [f(mon), f(sun)];
}

function getMonthRange() {
  const now = new Date();
  const y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,'0');
  const start = `${y}-${m}-01`;
  const lastDay = new Date(y, parseInt(m), 0).getDate();
  const end = `${y}-${m}-${String(lastDay).padStart(2,'0')}`;
  return [start, end];
}

function filterByDate(items, start, end) {
  return items.filter(t => t.date >= start && t.date <= end);
}

function calcExpense(list) { return list.reduce((s,t) => s + t.amount, 0); }
function calcIncome(list) { return list.reduce((s,t) => s + t.amount, 0); }

function groupByCategory(list) {
  const g = {};
  list.forEach(t => { g[t.category] = (g[t.category]||0) + t.amount; });
  return g;
}

function daysSinceStart() {
  const s = new Date(startDate);
  const n = new Date();
  return Math.max(1, Math.floor((n - s) / 86400000) + 1);
}

function renderPeriod(panelId, start, end, label) {

  const incs = filterByDate(incomeRecords.map(r => ({date:r.date, category:'收入', item:r.item, amount:r.amount})), start, end);

  if (txs.length === 0 && incs.length === 0) {

  const expTotal = calcExpense(txs);

    catOrder.forEach(cat => {
      const cfg = catConfig[cat] || {emoji:'📦',color:'#888'};
      const amt = grouped[cat];
      const pct = expTotal > 0 ? (amt/expTotal*100).toFixed(1) : 0;

    txs.slice().reverse().forEach(t => {
      const cfg = catConfig[t.category] || {emoji:'📦',color:'#888'};
      html += `

  if (incs.length > 0) {

      </select>
      <input type="date" id="filterStart" style="display:none" onchange="applyFilter()">
      <span id="filterSep" style="display:none">至</span>
      <input type="date" id="filterEnd" style="display:none" onchange="applyFilter()">
    </div>
    <div id="detailList"></div>`;
  panel.innerHTML = html;
  applyFilter();

function onPresetChange() {
  const v = document.getElementById('filterPreset').value;
  const s = document.getElementById('filterStart');
  const e = document.getElementById('filterEnd');
  const sep = document.getElementById('filterSep');

  if (v === 'custom') {
    s.style.display = '';
    e.style.display = '';
    sep.style.display = '';
    s.value = '2026-06-01';
    e.value = '2026-07-31';
    applyFilter();
  } else {
    s.style.display = 'none';
    e.style.display = 'none';
    sep.style.display = 'none';
    applyFilter();
  }
}

function applyFilter() {
  const preset = document.getElementById('filterPreset').value;
  let start = '', end = '9999-12-31';

  if (preset === 'jun') { start = '2026-06-01'; end = '2026-06-30'; }
  else if (preset === 'jul') { start = '2026-07-01'; end = '2026-07-31'; }
  else if (preset === 'custom') {
    start = document.getElementById('filterStart').value || '2026-06-01';
    end = document.getElementById('filterEnd').value || '2026-07-31';
  }

  const txs = filterByDate(transactions, start || '0000-01-01', end);
  const incs = filterByDate(incomeRecords, start || '0000-01-01', end);

  // Combine and sort
  const all = [
    ...txs.map(t => ({...t, type:'expense'})),
    ...incs.map(r => ({date:r.date, item:r.item, amount:r.amount, category:'收入', type:'income'}))
  ].sort((a,b) => b.date.localeCompare(a.date) || (a.type === 'income' ? -1 : 1));

  const expTotal = calcExpense(txs);
  const incTotal = calcIncome(incs.map(r => ({amount:r.amount})));

  let html = `
    <div class="day-summary">
      <div class="row"><span class="label">支出合计</span><span class="val exp">¥${fmt(expTotal)}</span></div>
      <div class="row"><span class="label">收入合计</span><span class="val inc">¥${fmt(incTotal)}</span></div>
      <div class="row"><span class="label">共 ${all.length} 笔</span><span class="val" style="color:var(--t3);font-size:13px">${start||'起始'} ~ ${end==='9999-12-31'?'至今':end}</span></div>
    </div>
    <div class="card"><div class="tx-list">`;

  all.forEach(t => {
    if (t.type === 'income') {
      html += `
        <div class="tx-item">
          <div class="tx-emoji">💰</div>
          <div class="tx-left">
            <div class="tx-name">${t.item}</div>
            <div class="tx-meta">${formatDate(t.date)} · 收入</div>
          </div>
          <div class="tx-amount income">+¥${fmt(t.amount)}</div>
        </div>`;
    } else {
      const cfg = catConfig[t.category] || {emoji:'📦',color:'#888'};
      html += `
        <div class="tx-item">
          <div class="tx-emoji">${cfg.emoji}</div>
          <div class="tx-left">
            <div class="tx-name">${t.item}</div>
            <div class="tx-meta">${formatDate(t.date)} · ${t.category}</div>
          </div>
          <div class="tx-amount expense">-¥${fmt(t.amount)}</div>
        </div>`;
    }
  });

  html += `</div></div>`;
  document.getElementById('detailList').innerHTML = html;
}

// ========== RENDER: 排盘 ==========
function renderPZRecommend() {
  let html = `<div class="card">
    <div class="card-title">🔮 ${pzWeek} 试炼排盘</div>
    <div style="font-size:12px;color:var(--t3);margin-bottom:12px">奇门遁甲·转盘·增强版v9 | 已过滤凶格（门迫+空亡+击刑）</div>
    <div class="day-summary">
      <div class="row"><span class="label">8/3-8/7</span><span class="val" style="color:var(--orange);font-size:14px">大暑下元 · 阴遁4局</span></div>
      <div class="row"><span class="label">8/8-8/9</span><span class="val" style="color:var(--purple);font-size:14px">立秋上元 · 阴遁8局</span></div>
    </div>
  </div>`;

  pzAccounts.forEach(acc => {
    const recs = pzRecommend[acc.name] || [];
    const best = recs.find(r => r.pri === 'A') || recs[0];
    const sqTag = acc.sq ? '<span style="color:var(--yellow);font-size:11px;margin-left:6px">⚡三奇</span>' : '';
    html += `<div class="card">
      <div class="card-title">${acc.icon} ${acc.name}（${acc.school}·日干${acc.rg}）${sqTag}</div>`;
    if (best) {
      const isTop = best.tag.includes('三奇得使');
      html += `<div style="background:var(--inset);border-radius:var(--rs);padding:14px;margin-bottom:10px;border-left:4px solid ${isTop ? 'var(--yellow)' : 'var(--green)'}">
        <div style="font-size:11px;color:var(--t3);margin-bottom:4px">🎯 首选</div>
        <div style="font-size:16px;font-weight:700;color:var(--t1)">${best.dt} ${best.t}</div>
        <div style="font-size:13px;color:${isTop ? 'var(--yellow)' : 'var(--green)'};margin-top:4px">${best.gong} ${best.men} ${best.tag || '★吉门'}</div>
      </div>`;
    }
    if (recs.length > 1) {
      html += `<div style="font-size:12px;color:var(--t2);margin-bottom:6px">全部可用 ${recs.length} 个时段：</div>`;
      recs.slice(0, 4).forEach(r => {
        const c = r.pri === 'A' ? 'var(--yellow)' : 'var(--t2)';
        html += `<div style="font-size:12px;color:var(--t3);padding:4px 0;border-bottom:1px solid var(--bdr)">
          <span style="color:${c};font-weight:600">${r.dt}</span> ${r.t} · ${r.gong}${r.men} ${r.tag || '★'}</div>`;
      });
      if (recs.length > 4) {
        html += `<div style="font-size:11px;color:var(--t3);margin-top:4px">等 ${recs.length - 4} 个更多时段...</div>`;
      }
    } else if (recs.length === 0) {
      html += `<div style="font-size:13px;color:var(--red);padding:10px 0">⚠️ 本周无可用吉时</div>`;
    }
    html += `</div>`;
  });

  // 凶格过滤汇总
  const totalFiltered = Object.values(pzFiltered).reduce((s, a) => s + a.length, 0);
  html += `<div class="card">
    <div class="card-title" style="color:var(--red)">⚠️ 凶格过滤</div>
    <div style="font-size:12px;color:var(--t3);margin-bottom:8px">共排除 ${totalFiltered} 个吉门时段（门迫/空亡/击刑）</div>`;
  pzAccounts.forEach(acc => {
    const items = pzFiltered[acc.name] || [];
    if (items.length > 0) {
      html += `<div style="font-size:12px;color:var(--t2);margin-bottom:4px;margin-top:8px">${acc.name} 被排除 ${items.length} 个：</div>`;
      items.slice(0, 3).forEach(f => {
        html += `<div style="font-size:11px;color:var(--t3);padding:2px 0">· ${f.dt} ${f.t} ${f.gong}${f.men} ← ${f.reason}</div>`;
      });
      if (items.length > 3) html += `<div style="font-size:11px;color:var(--t3)">...等共 ${items.length} 个</div>`;
    }
  });
  html += `</div>`;

  document.getElementById('sub-pz-recommend').innerHTML = html;
}

function renderPZDetail() {
  let html = '';
  pzAccounts.forEach(acc => {
    const recs = pzRecommend[acc.name] || [];
    html += `<div class="card">
      <div class="card-title">${acc.icon} ${acc.name} · 吉时表</div>
      <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <tr style="color:var(--t3);border-bottom:1px solid var(--bdr)">
          <th style="text-align:left;padding:6px 4px">日期</th>
          <th style="text-align:left;padding:6px 4px">时段</th>
          <th style="text-align:left;padding:6px 4px">宫·门</th>
          <th style="text-align:left;padding:6px 4px">吉格</th>
        </tr>`;
    recs.forEach(r => {
      const isA = r.pri === 'A';
      html += `<tr style="border-bottom:1px solid var(--bdr)">
          <td style="padding:8px 4px;color:${isA ? 'var(--yellow)' : 'var(--t2)'};font-weight:${isA ? 600 : 400}">${r.dt}</td>
          <td style="padding:8px 4px;color:var(--t1)">${r.t}</td>
          <td style="padding:8px 4px;color:var(--t1)">${r.gong} ${r.men}</td>
          <td style="padding:8px 4px;color:${isA ? 'var(--yellow)' : 'var(--green)'}">${r.tag || '★吉门'}</td>
        </tr>`;
    });
    html += `</table></div></div>`;
  });
  document.getElementById('sub-pz-detail').innerHTML = html;
}

function renderTrToday() {
  const now = new Date();
  const jsDay = now.getDay(); // 0=Sun
  const idx = jsDay === 0 ? 6 : jsDay - 1; // convert to 0=Mon
  const d = V7_WEEK[idx];
  let h = '';
  if (d.type === 0) {
    h = `<div class="card" style="text-align:center;padding:60px 20px">
      <div style="font-size:48px;opacity:0.3">🛋️</div>
      <div style="font-size:18px;color:var(--t1);font-weight:600;margin-top:12px">${d.day} · 休息日</div>
      <div style="font-size:13px;color:var(--t3);margin-top:6px">完全休息。如需补课用休息日补力量模块。</div>
    </div>`;
    document.getElementById('sub-tr-today').innerHTML = h;
    return;
  }
  // Header card
  h += `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div>
        <div style="font-size:11px;color:var(--t3)">今日训练 · ${d.day}</div>
        <div style="font-size:16px;font-weight:700;color:${d.color};margin-top:2px">${d.label}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:22px;font-weight:800;color:var(--t1)">${d.dur}<span style="font-size:11px;color:var(--t3)">min</span></div>
        <div style="font-size:11px;color:var(--t3)">精力${d.energy}</div>
      </div>
    </div>
  </div>`;
  // Activation
  if (d.activation && d.activation !== '无额外激活') {
    h += `<div class="card" style="border-left:3px solid var(--orange)">
      <div class="card-title" style="color:var(--orange)">⚡ 推前激活（必做，在主项之前）</div>
      <div style="font-size:13px;color:var(--t1)">${d.activation}</div>
    </div>`;
  }
  // Main lifts
  if (d.main) {
    h += `<div class="card"><div class="card-title">🏋️ 主项（组间休息60-75秒，离心3-4秒）</div>`;
    d.main.forEach((ex,i) => {
      h += `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bdr)">
        <div><div style="font-size:13px;color:var(--t1);font-weight:500">${i+1}. ${ex.n}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:2px">${ex.note||''}</div></div>
        <div style="text-align:right;flex-shrink:0;margin-left:12px">
          <div style="font-size:13px;font-weight:600;color:var(--t1)">${ex.s}</div>
          <div style="font-size:11px;color:var(--t2)">${ex.w}</div>
        </div></div>`;
    });
    h += `</div>`;
  }
  // Leg main
  if (d.legMain) {
    h += `<div class="card"><div class="card-title">🦵 下肢主项（组间休息75-90秒）</div>`;
    d.legMain.forEach((ex,i) => {
      h += `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bdr)">
        <div><div style="font-size:13px;color:var(--t1);font-weight:500">${i+1}. ${ex.n}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:2px">${ex.note||''}</div></div>
        <div style="text-align:right;flex-shrink:0;margin-left:12px">
          <div style="font-size:13px;font-weight:600;color:var(--t1)">${ex.s}</div>
          <div style="font-size:11px;color:var(--t2)">${ex.w}</div>
        </div></div>`;
    });
    h += `</div>`;
  }
  // Core
  if (d.core) {
    h += `<div class="card"><div class="card-title">🎯 核心训练（组间休息45秒）</div>`;
    d.core.forEach((ex,i) => {
      const badge = ex.new ? '<span style="background:var(--green);color:#fff;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px">NEW</span>' : '';
      h += `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bdr)">
        <div><div style="font-size:13px;color:var(--t1);font-weight:500">${i+1}. ${ex.n}${badge}</div>
        <div style="font-size:11px;color:var(--t3);margin-top:2px">${ex.note||''}</div></div>
        <div style="text-align:right;flex-shrink:0;margin-left:12px">
          <div style="font-size:13px;font-weight:600;color:var(--t1)">${ex.s}</div>
          <div style="font-size:11px;color:var(--t2)">${ex.w}</div>
        </div></div>`;
    });
    h += `</div>`;
  }
  // Finisher
  if (d.finisher) {
    h += `<div class="card"><div class="card-title">🔥 ${d.finisher.split('(')[0]}</div>
      <div style="font-size:12px;color:var(--t2)">${d.finisher}</div></div>`;
  }
  // HIIT
  if (d.hiit) {
    h += `<div class="card"><div class="card-title">💨 ${d.hiit.split('(')[0]}</div>
      <div style="font-size:12px;color:var(--t2)">${d.hiit}</div></div>`;
  }
  // Extra (scapular)
  if (d.extra) {
    h += `<div class="card"><div class="card-title">🛡️ ${d.extra.split('(')[0]}</div>
      <div style="font-size:12px;color:var(--t2)">${d.extra}</div></div>`;
  }
  // Cooldown
  if (d.cool) {
    h += `<div class="card"><div class="card-title">🧊 ${d.cool.split('(')[0]}</div>
      <div style="font-size:12px;color:var(--t2)">${d.cool}</div></div>`;
  }
  document.getElementById('sub-tr-today').innerHTML = h;
}

function renderTrWeek() {
  let h = `<div class="card"><div class="card-title">📅 V7 周训练计划</div>`;
  h += `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
    <tr style="color:var(--t3);border-bottom:1px solid var(--bdr)">
      <th style="text-align:left;padding:8px 6px">日</th>
      <th style="text-align:left;padding:8px 6px">内容</th>
      <th style="text-align:right;padding:8px 6px">时长</th>
      <th style="text-align:center;padding:8px 6px">精力</th>
    </tr>`;
  const now = new Date();
  const todayIdx = now.getDay() === 0 ? 6 : now.getDay() - 1;
  V7_WEEK.forEach((d,i) => {
    const isToday = i === todayIdx;
    const isRest = d.type === 0;
    const bg = isToday ? 'background:rgba(0,122,255,0.06);' : '';
    const rowStyle = isRest ? 'color:var(--t3)' : 'color:var(--t1)';
    h += `<tr style="border-bottom:1px solid var(--bdr);${bg}">
      <td style="padding:10px 6px;font-weight:${isToday?700:500};${rowStyle}">${d.day}${isToday?' ←':''}</td>
      <td style="padding:10px 6px;${rowStyle}">${d.label}</td>
      <td style="padding:10px 6px;text-align:right;${rowStyle}">${d.dur||'-'}min</td>
      <td style="padding:10px 6px;text-align:center;font-size:11px;${rowStyle}">${d.energy}</td>
    </tr>`;
  });
  h += `</table></div></div>`;
  // Weekly targets
  h += `<div class="card"><div class="card-title">📊 周总量目标</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div style="background:var(--inset);border-radius:8px;padding:12px;text-align:center">
        <div style="font-size:20px;font-weight:700;color:var(--blue)">5次</div>
        <div style="font-size:11px;color:var(--t3)">力量(A×2+B×1+C×2)</div>
      </div>
      <div style="background:var(--inset);border-radius:8px;padding:12px;text-align:center">
        <div style="font-size:20px;font-weight:700;color:var(--orange)">90min</div>
        <div style="font-size:11px;color:var(--t3)">HIIT总量</div>
      </div>
      <div style="background:var(--inset);border-radius:8px;padding:12px;text-align:center">
        <div style="font-size:20px;font-weight:700;color:var(--green)">3次</div>
        <div style="font-size:11px;color:var(--t3)">肩胛协议</div>
      </div>
      <div style="background:var(--inset);border-radius:8px;padding:12px;text-align:center">
        <div style="font-size:20px;font-weight:700;color:var(--purple)">~450min</div>
        <div style="font-size:11px;color:var(--t3)">周训练总时长</div>
      </div>
    </div>
    <div style="margin-top:12px;font-size:11px;color:var(--t3);line-height:1.8">
      <div>⚡ 推日前必做：弹力带肩外旋+面拉（保护肩袖）</div>
      <div>🎯 核心新增：Pallof Press（抗旋转）</div>
      <div>🦵 下肢策略：维持现有重量，不追PR</div>
      <div>⏱️ 所有动作离心3-4秒控制</div>
    </div>
  </div>`;
  document.getElementById('sub-tr-week').innerHTML = h;
}

function renderTrLib() {
  const cats = {};
  V7_LIB.forEach(ex => {
    if (!cats[ex.cat]) cats[ex.cat] = [];
    cats[ex.cat].push(ex);
  });
  let h = '';
  Object.entries(cats).forEach(([cat, exs]) => {
    h += `<div class="card"><div class="card-title">${cat}</div>`;
    exs.forEach(ex => {
      h += `<div style="padding:10px 0;border-bottom:1px solid var(--bdr)">
        <div style="font-size:13px;color:var(--t1);font-weight:500">${ex.name}</div>
        <div style="font-size:12px;color:var(--t2);margin-top:4px;line-height:1.6">${ex.desc}</div>
      </div>`;
    });
    h += `</div>`;
  });
  document.getElementById('sub-tr-lib').innerHTML = h;
}

// ========== INIT ==========


function saveTransactions() {
  localStorage.setItem('comprehensive_transactions', JSON.stringify(transactions));
}

function recalcTotals() {
  // 重新计算 catTotals
  catTotals = {};
  transactions.forEach(t => {
    if (t.category && t.amount > 0) {
      catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
    }
  });
  
  // 重新计算 totalExpense
  totalExpense = transactions.reduce((sum, t) => sum + (t.amount || 0), 0);
  
  // 重新计算 totalIncome（如果有 incomeRecords）
  if (typeof incomeRecords !== 'undefined') {
    totalIncome = incomeRecords.reduce((sum, r) => sum + (r.amount || 0), 0);
  }
  
  // 重新计算 balance
  balance = totalIncome - totalExpense;
}

function refreshAllViews() {
  // 重新计算汇总数据
  recalcTotals();
  renderOverview();
  const now = new Date();
  renderPeriod('sub-today', now.toISOString().slice(0,10), now.toISOString().slice(0,10), '今日');
  const [wStart, wEnd] = getWeekRange();
  renderPeriod('sub-week', wStart, wEnd, '本周');
  renderMonth();
  renderDetail();
}

function confirmTransaction() {
  const date = document.getElementById('add-date').value;
  const amount = parseFloat(document.getElementById('add-amount').value);
  const category = document.getElementById('add-category').value;
  const item = document.getElementById('add-item').value;
  
  if (!date || !amount || amount <= 0 || !item || !category) return;
  
  transactions.push({date: date, category: category, item: item, amount: amount});
  saveTransactions();
  
  // Reset form
  document.getElementById('add-date').value = '';
  document.getElementById('add-amount').value = '';
  document.getElementById('add-category').value = '';
  document.getElementById('add-item').value = '';
  
  // Hide confirm, show form
  document.getElementById('add-confirm').style.display = 'none';
  document.getElementById('add-form').style.display = 'flex';
  
  // Show success toast
  const msg = document.createElement('div');
  msg.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#00E676;color:#000;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:9999';
  msg.textContent = '✓ 已录入成功';
  document.body.appendChild(msg);
  setTimeout(function(){ msg.remove(); }, 2000);
  
  refreshAllViews();
}

function cancelPreview() {
  document.getElementById('add-confirm').style.display = 'none';
  document.getElementById('add-form').style.display = 'flex';
}

function init() {
  // Set header date
  const now = new Date();
  document.getElementById('headerDate').textContent = now.toISOString().slice(0,10);

  renderOverview();
  renderPeriod('sub-today', now.toISOString().slice(0,10), now.toISOString().slice(0,10), '今日');
  const [wStart, wEnd] = getWeekRange();
  renderPeriod('sub-week', wStart, wEnd, '本周');
  renderMonth();
  renderDetail();
  renderDaigou();
  renderTrToday();
  renderTrWeek();
  renderTrLib();
  renderPZRecommend();
  renderPZDetail();
  renderPZInfo();
}

function previewTransaction() {
  const date = document.getElementById('add-date').value;
  const amount = parseFloat(document.getElementById('add-amount').value);
  const category = document.getElementById('add-category').value;
  const item = document.getElementById('add-item').value;
  
  if (!date || !amount || amount <= 0 || !item) {
    const msg = document.createElement('div');
    msg.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#ff3b30;color:white;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:9999';
    msg.textContent = '请填写完整信息';
    document.body.appendChild(msg);
    setTimeout(() => msg.remove(), 2000);
    return;
  }
  if (!category) {
    const msg = document.createElement('div');
    msg.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#ff3b30;color:white;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:600;z-index:9999';
    msg.textContent = '请选择分类';
    document.body.appendChild(msg);
    setTimeout(() => msg.remove(), 2000);
    return;
  }
  
  document.getElementById('confirm-detail').innerHTML = '📅 日期：' + date + '<br>💰 金额：¥' + amount.toFixed(2) + '<br>📂 分类：' + category + '<br>📝 备注：' + item;
  document.getElementById('add-form').style.display = 'none';
  document.getElementById('add-confirm').style.display = 'block';
}
init();</script>
